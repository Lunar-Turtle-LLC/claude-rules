name: Sync rules

# Copies the golden copy into every repo in sync.json and opens (or updates) a pull request there.
# The weekly run also reverts hand edits made to synced files in those repos.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 1"

concurrency:
  group: sync-rules
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.matrix.outputs.repos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: matrix
        run: echo "repos=$(node scripts/matrix.mjs)" >> "$GITHUB_OUTPUT"

  sync:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.repos) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: claude-rules
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets[matrix.tokenSecret] }}
          path: target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write rules into the repo
        env:
          TARGET_REPO: ${{ matrix.repo }}
        run: node claude-rules/scripts/sync.mjs "$TARGET_REPO" target
      - uses: peter-evans/create-pull-request@v7
        with:
          path: target
          token: ${{ secrets[matrix.tokenSecret] }}
          add-paths: .claude
          branch: claude-rules/sync
          delete-branch: true
          commit-message: Sync Claude rules from claude-rules
          title: Sync Claude rules from claude-rules
          body: |
            Updates `.claude/rules` and `.claude/skills` from the golden copy in [Lunar-Turtle-LLC/claude-rules](https://github.com/Lunar-Turtle-LLC/claude-rules/commit/${{ github.sha }}).

            Don't edit these files here. Change them in claude-rules and the next sync updates this PR.
          assignees: khendricks
